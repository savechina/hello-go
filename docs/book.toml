[book]
authors = ["RenYan Wei"]
language = "en"
multilingual = false
src = "src"
title = "Hello Go - Go 编程从入门到实战教程"
description = "Hello Go 是一套完整的 Go 编程教程，涵盖基础语法、并发编程、Web 开发、数据库、微服务等章节。"


[preprocessor.admonish]
# command = "mdbook-admonish"
assets_version = "3.1.0" # do not edit: managed by `mdbook-admonish install`

[preprocessor.alerts]
# command = "mdbook-alerts"

[preprocessor.pagetoc]

[output.html]
default-theme = "light"
git-repository-url = "https://github.com/savechina/hello-go"
git-repository-icon = "fa-github"

additional-css = ["./assets/css/mdbook-admonish.css", "./theme/pagetoc.css"]
additional-js = ["./theme/pagetoc.js","./assets/js/ga.js"]
